# CI base do monorepo: um job por app, em paralelo.
#
# Escopo deliberado: só o que roda OFFLINE e rápido. O eval com LLM real vive em
# workflow separado (eval-llm.yml), porque gasta API e é estocástico — misturar os
# dois faria o gate de merge depender do humor de um modelo.
name: CI

on:
  push:
    branches: [desenvolvimento, produto-v2]
  pull_request:

# PR novo cancela a execução anterior do mesmo branch: economiza minuto de runner
# sem perder sinal (só o último commit importa para o merge).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai:
    name: apps/ai (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Mesma minor da imagem de produção (apps/ai/Dockerfile: python:3.11-slim).
          # Testar em outra versão esconderia incompatibilidade de dependência pinada.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # A suíte é offline por construção (pytest.ini exclui o marcador `llm` e
      # tests/conftest.py aponta as URLs para porta fechada).
      - run: python -m pytest

  api:
    name: apps/api (go vet + go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      # Sem a tag `integration`, os testes que exigem Postgres real
      # (internal/store/integracao_test.go) ficam de fora — este job não sobe banco.
      - run: go test ./...

  web:
    name: apps/web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
