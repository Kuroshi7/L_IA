# Menu-AI v2 — stack de desenvolvimento.
# Subir: (no diretório deploy/)  docker compose up -d --build
# Seed:  docker compose run --rm api-seed
# Index RAG: docker compose run --rm ai-indexer
#
# restart: infra "no" (não sobe no boot); serviços de app "on-failure" (voltam após crash).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menuai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menuai}
      POSTGRES_DB: ${POSTGRES_DB:-menuai}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${MENUAI_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-menuai} -d ${POSTGRES_DB:-menuai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: "no"
    ports:
      - "${MENUAI_RABBIT_PORT:-5672}:5672"
      - "${MENUAI_RABBIT_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # API Go — fonte da verdade. Aplica migrations no startup e roda o outbox relay.
  api:
    build:
      context: ../apps/api
    restart: on-failure:5
    environment:
      API_HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-60}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${MENUAI_API_PORT:-8080}:8080"

  # Seed one-shot (unidades, cardápio do dia, medidas caseiras, guias).
  api-seed:
    build:
      context: ../apps/api
    command: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Worker Go — consome eventos de domínio (outbox → RabbitMQ) de forma idempotente.
  api-worker:
    build:
      context: ../apps/api
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure:5

  # Worker de IA — consome chat.requests, roda o agente, responde via RPC.
  ai-worker:
    build:
      context: ../apps/ai
    command: ["python", "-m", "app.workers.chat_worker"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_INTERNAL_URL: http://api:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_started
    restart: on-failure:5
    # Escale a concorrência rodando mais réplicas:  docker compose up -d --scale ai-worker=3

  # API Python (health + /infer + webhook Telegram). Opcional para o fluxo principal.
  ai-api:
    build:
      context: ../apps/ai
    environment:
      API_INTERNAL_URL: http://api:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${MENUAI_AI_PORT:-8000}:8000"
    restart: on-failure:5

  # Indexador RAG one-shot (chunk + embed dos guias → pgvector).
  ai-indexer:
    build:
      context: ../apps/ai
    command: ["python", "-m", "app.rag.indexer"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-menuai}:${POSTGRES_PASSWORD:-menuai}@postgres:5432/${POSTGRES_DB:-menuai}?sslmode=disable
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ../apps/web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: on-failure:5
    depends_on:
      - api
    ports:
      - "${MENUAI_WEB_PORT:-5273}:80"

  # Ollama local (LLM + embeddings). Use LLM_PROVIDER=anthropic para não depender dele.
  ollama:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${MENUAI_OLLAMA_PORT:-11534}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for m in "$$OLLAMA_MODEL" "$$EMBED_MODEL"; do
          if ollama list | awk '{print $$1}' | grep -q "^$$m"; then
            echo "Modelo $$m já em cache.";
          else
            echo "Baixando $$m...";
            ollama pull "$$m";
          fi
        done
    restart: "no"

volumes:
  pg_data:
  ollama_data:
