server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # DNS do Docker, re-resolvido a cada 10s.
    #
    # Sem isto o nginx resolve o nome do upstream UMA VEZ, no boot, e guarda o IP
    # para sempre. Em 24/08/2026 o container web subiu, gravou 172.21.0.5, e o
    # Docker depois deu esse IP ao ai-worker: todo o front passou a devolver 502,
    # com a tela perguntando "o backend está rodando?" — com o backend rodando e
    # saudável. Qualquer recriação da API reproduz isso, e só um restart do nginx
    # corrige.
    #
    # `ipv6=off` porque o embedded DNS do Docker responde AAAA vazio e o nginx
    # trataria como falha de resolução.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy reverso: /api/* -> API Go (sem o prefixo /api). Evita CORS no Docker.
    location /api/ {
        # Via variável DE PROPÓSITO: com o hostname literal em proxy_pass o nginx
        # resolve no boot e cacheia; com variável ele usa o `resolver` acima em
        # tempo de execução. É essa diferença que conserta o bug.
        #
        # O `rewrite` é obrigatório aqui: com hostname literal o nginx troca o
        # prefixo do location pelo caminho de proxy_pass sozinho, mas com
        # variável ele repassa a URI inteira — /api/unidades chegava à API como
        # /api/unidades e voltava 404.
        set $upstream_api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback (react-router em modo browser)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
