[pytest]
testpaths = tests

markers =
    llm: exige um LLM real (Anthropic ou Ollama); não roda por padrão

# A suíte padrão é OFFLINE e determinística: `pytest` não deve gastar API nem
# depender de modelo local. Os casos marcados com `llm` ficam de fora daqui e
# rodam sob demanda (`pytest -m llm`, que sobrescreve este `-m`) ou no workflow
# noturno de eval. Sem isso, um `pytest` distraído em máquina com ANTHROPIC_API_KEY
# vira conta no cartão.
addopts = -m "not llm" -q
